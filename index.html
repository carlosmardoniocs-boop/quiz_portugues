<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Literário</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  body.tema-fosforo { --fundo:#0b0f0d; --fundo-caixa:#0f1512; --linha:#1f3d2a; --texto:#8fd7a8; --destaque:#4dff88; --erro:#ff6b6b; }
  body.tema-ambar   { --fundo:#140d04; --fundo-caixa:#1d1407; --linha:#5a3c12; --texto:#d99a3f; --destaque:#ffb000; --erro:#ff7a5c; }
  body.tema-dos     { --fundo:#050f4d; --fundo-caixa:#0a1a63; --linha:#25368f; --texto:#c7d3ff; --destaque:#ffffff; --erro:#ff6b6b; }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--fundo);
    color: var(--texto);
    font-family: 'Courier New', 'IBM Plex Mono', monospace;
    display: flex;
    justify-content: center;
    padding: 24px 14px;
  }
  #tela { width: 100%; max-width: 640px; }
  .linha-topo {
    color: var(--linha);
    white-space: pre;
    overflow-x: auto;
    font-size: 14px;
    line-height: 1.4;
  }
  h1.cabecalho {
    text-align: center;
    color: var(--destaque);
    font-size: 15px;
    letter-spacing: 2px;
    margin: 2px 0;
    text-transform: uppercase;
  }
  .corpo { padding: 14px 4px 30px; line-height: 1.6; font-size: 15px; }
  .corpo p { margin: 0 0 14px; }
  .destaque-texto { color: var(--destaque); }
  .erro-texto { color: var(--erro); }
  .opcao {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--fundo-caixa);
    border: 1px solid var(--linha);
    color: var(--texto);
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    border-radius: 2px;
  }
  .opcao.selecionada { border-color: var(--destaque); color: var(--destaque); }
  .opcao:active, .opcao:focus-visible { border-color: var(--destaque); color: var(--destaque); outline: none; }
  .rotulo { color: var(--destaque); margin-right: 8px; }
  input[type=text] {
    width: 100%;
    background: var(--fundo-caixa);
    border: 1px solid var(--linha);
    color: var(--destaque);
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    margin: 10px 0;
    border-radius: 2px;
  }
  input[type=text]:focus { outline: none; border-color: var(--destaque); }
  .rodape-dica { color: var(--linha); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body class="tema-fosforo">
<div id="tela"></div>

<script>
const LARGURA = 38;

const CONFIG = { velocidade: 18, tema: "fosforo", som: true, onda: "square" };

const TEMAS = [
  { chave: "fosforo", nome: "Fósforo Verde" },
  { chave: "ambar", nome: "Âmbar" },
  { chave: "dos", nome: "DOS Azul" },
];

const ONDAS = [
  { chave: "square", nome: "Quadrada" },
  { chave: "triangle", nome: "Triangular" },
  { chave: "sawtooth", nome: "Serrilhada" },
];

function aplicarTema(chave) {
  CONFIG.tema = chave;
  document.body.className = "tema-" + chave;
}

// ================= SOM (Web Audio API - sem nenhum arquivo de áudio) =================

let audioCtx = null;

function iniciarAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { audioCtx = null; }
}

function tocarTom(frequencia, duracao, tipoOnda) {
  if (!CONFIG.som || !audioCtx) return;
  if (audioCtx.state === "suspended") audioCtx.resume();
  try {
    const osc = audioCtx.createOscillator();
    const ganho = audioCtx.createGain();
    osc.type = tipoOnda || CONFIG.onda;
    osc.frequency.value = frequencia;
    const agora = audioCtx.currentTime;
    ganho.gain.setValueAtTime(0.18, agora);
    ganho.gain.exponentialRampToValueAtTime(0.001, agora + duracao);
    osc.connect(ganho).connect(audioCtx.destination);
    osc.start(agora);
    osc.stop(agora + duracao);
  } catch (e) {}
}

function somTecla() { tocarTom(1046, 0.03); }
function somConfirmar() { tocarTom(660, 0.05); }
function somAcerto() { tocarTom(660, 0.09); setTimeout(() => tocarTom(990, 0.12), 90); }
function somErro() { tocarTom(150, 0.25); }

// ================= UTIL: DIGITAR =================

function pausar(ms) { return new Promise(r => setTimeout(r, ms)); }

let PULAR_TELA = false;

async function digitar(container, texto, classe) {
  const span = document.createElement("span");
  if (classe) span.className = classe;
  container.appendChild(span);

  if (PULAR_TELA) { span.textContent = texto; return span; }

  const aoClicar = () => { PULAR_TELA = true; };
  document.addEventListener("click", aoClicar, { once: true });
  document.addEventListener("keydown", aoClicar, { once: true });

  let contador = 0;
  for (const letra of texto) {
    if (PULAR_TELA) { span.textContent = texto; break; }
    span.textContent += letra;
    contador++;
    if (contador % 2 === 0) somTecla();
    await pausar(CONFIG.velocidade);
  }
  document.removeEventListener("click", aoClicar);
  document.removeEventListener("keydown", aoClicar);
  return span;
}

async function digitarParagrafo(container, texto, classe) {
  const p = document.createElement("p");
  container.appendChild(p);
  await digitar(p, texto, classe);
}

function linhaOrnamento(caractere) {
  const div = document.createElement("div");
  div.className = "linha-topo";
  div.textContent = caractere.repeat(LARGURA);
  return div;
}

function cabecalho(titulo) {
  PULAR_TELA = false;
  const tela = document.getElementById("tela");
  tela.innerHTML = "";
  tela.appendChild(linhaOrnamento("="));
  const h1 = document.createElement("h1");
  h1.className = "cabecalho";
  h1.textContent = titulo;
  tela.appendChild(h1);
  tela.appendChild(linhaOrnamento("="));
  const corpo = document.createElement("div");
  corpo.className = "corpo";
  tela.appendChild(corpo);
  return corpo;
}

function criarBotao(html, aoClicar, selecionada) {
  const botao = document.createElement("button");
  botao.className = "opcao" + (selecionada ? " selecionada" : "");
  botao.innerHTML = html;
  botao.onclick = () => { somConfirmar(); aoClicar(); };
  return botao;
}

// ================= FETCH DE ARQUIVOS =================

async function buscarTexto(caminho) {
  const resposta = await fetch(caminho, { cache: "no-store" });
  if (!resposta.ok) throw new Error("Não encontrei: " + caminho);
  return await resposta.text();
}

async function buscarLista(caminho) {
  const texto = await buscarTexto(caminho);
  return texto.split(/\r\n|\r|\n/).map(l => l.trim()).filter(l => l !== "");
}

// ================= PARSER DE QUESTÕES =================

function carregarQuestoes(texto) {
  const linhas = texto.split(/\r\n|\r|\n/).map(l => l.trim());
  const questoes = [];
  let questao = { textos: [], item: "", alternativas: [], resposta: "" };
  let marcador = "";
  const padraoAlternativa = /^([A-Ea-e1-5])\s*[)\.:\-]\s*(.*)$/;

  for (const linha of linhas) {
    if (linha === "===") {
      if (questao.item !== "") questoes.push(questao);
      questao = { textos: [], item: "", alternativas: [], resposta: "" };
      marcador = "";
    } else if (linha === "TEXTO:") {
      marcador = "texto";
      questao.textos.push("");
    } else if (linha === "ITEM:") {
      marcador = "item";
      questao.item = "";
    } else if (padraoAlternativa.test(linha)) {
      marcador = "alternativa";
      const m = linha.match(padraoAlternativa);
      questao.alternativas.push({ rotulo: m[1], texto: m[2].trim() });
    } else if (linha === "RESPOSTA:") {
      marcador = "resposta";
    } else if (linha === "") {
      if (marcador === "texto" && questao.textos[questao.textos.length - 1] !== "") {
        questao.textos[questao.textos.length - 1] += "\n";
      } else if (marcador === "item" && questao.item !== "") {
        questao.item += "\n";
      }
    } else {
      if (marcador === "texto") {
        const i = questao.textos.length - 1;
        questao.textos[i] = questao.textos[i] === "" ? linha : questao.textos[i] + "\n" + linha;
      } else if (marcador === "item") {
        questao.item = questao.item === "" ? linha : questao.item + "\n" + linha;
      } else if (marcador === "alternativa") {
        const i = questao.alternativas.length - 1;
        questao.alternativas[i].texto = questao.alternativas[i].texto === "" ? linha : questao.alternativas[i].texto + "\n" + linha;
      } else if (marcador === "resposta") {
        questao.resposta = questao.resposta === "" ? linha : questao.resposta + "\n" + linha;
      }
    }
  }
  if (questao.item !== "") questoes.push(questao);
  return questoes;
}

function normalizarAlternativa(valor) {
  if (!valor) return null;
  valor = valor.trim().toUpperCase().replace(/[.):\s\-]/g, "");
  if (valor === "") return null;
  const mapa = { A: "1", B: "2", C: "3", D: "4", E: "5" };
  if (mapa[valor]) return mapa[valor];
  if (/^\d+$/.test(valor)) return valor;
  return null;
}

function embaralhar(lista) {
  const copia = lista.slice();
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

// ================= TELAS =================

async function telaIntro() {
  const corpo = cabecalho("Quiz Literário");
  try {
    const texto = await buscarTexto("telas/intro.txt");
    for (const linha of texto.split(/\r\n|\r|\n/)) {
      if (linha.trim() !== "") await digitarParagrafo(corpo, linha);
    }
  } catch (e) {
    await digitarParagrafo(corpo, "Pressione para começar.");
  }
  const dica = document.createElement("p");
  dica.className = "rodape-dica";
  dica.textContent = "toque na tela para continuar";
  corpo.appendChild(dica);
  await new Promise(resolver => {
    document.addEventListener("click", () => { iniciarAudio(); resolver(); }, { once: true });
  });
  telaMenu();
}

async function telaMenu() {
  const corpo = cabecalho("Menu");
  corpo.appendChild(criarBotao('<span class="rotulo">›</span>Jogar', telaCategorias));
  corpo.appendChild(criarBotao('<span class="rotulo">›</span>Configurações', telaConfiguracoes));
  corpo.appendChild(criarBotao('<span class="rotulo">›</span>Créditos', telaCreditos));
}

async function telaConfiguracoes() {
  const corpo = cabecalho("Configurações");

  const rotuloTema = document.createElement("p");
  rotuloTema.className = "destaque-texto";
  rotuloTema.textContent = "Tema:";
  corpo.appendChild(rotuloTema);
  for (const tema of TEMAS) {
    corpo.appendChild(criarBotao(tema.nome, () => { aplicarTema(tema.chave); telaConfiguracoes(); }, CONFIG.tema === tema.chave));
  }

  const rotuloSom = document.createElement("p");
  rotuloSom.className = "destaque-texto";
  rotuloSom.textContent = "Som:";
  corpo.appendChild(rotuloSom);
  corpo.appendChild(criarBotao(CONFIG.som ? "Ligado" : "Desligado", () => { CONFIG.som = !CONFIG.som; telaConfiguracoes(); }));

  const rotuloOnda = document.createElement("p");
  rotuloOnda.className = "destaque-texto";
  rotuloOnda.textContent = "Tipo de onda:";
  corpo.appendChild(rotuloOnda);
  for (const onda of ONDAS) {
    corpo.appendChild(criarBotao(onda.nome, () => { CONFIG.onda = onda.chave; telaConfiguracoes(); }, CONFIG.onda === onda.chave));
  }

  corpo.appendChild(criarBotao("Voltar", telaMenu));
}

async function telaCreditos() {
  const corpo = cabecalho("Créditos");
  try {
    const texto = await buscarTexto("telas/creditos.txt");
    for (const linha of texto.split(/\r\n|\r|\n/)) {
      if (linha.trim() !== "") await digitarParagrafo(corpo, linha);
    }
  } catch (e) {
    await digitarParagrafo(corpo, "Sem créditos cadastrados.");
  }
  corpo.appendChild(criarBotao("Voltar", telaMenu));
}

async function telaCategorias() {
  const corpo = cabecalho("Categorias");
  let arquivos = [];
  try {
    arquivos = await buscarLista("perguntas/lista.txt");
  } catch (e) {
    await digitarParagrafo(corpo, "Não encontrei perguntas/lista.txt.", "erro-texto");
    return;
  }
  for (const arquivo of arquivos) {
    const nome = arquivo.replace(".txt", "");
    corpo.appendChild(criarBotao('<span class="rotulo">›</span>' + nome, () => telaQuiz(arquivo)));
  }
  corpo.appendChild(criarBotao("Voltar", telaMenu));
}

async function telaQuiz(arquivo) {
  const corpo = cabecalho("Quiz Literário");
  let perguntas;
  try {
    const texto = await buscarTexto("perguntas/" + arquivo);
    perguntas = carregarQuestoes(texto);
  } catch (e) {
    await digitarParagrafo(corpo, "Não consegui carregar esse quiz.", "erro-texto");
    return;
  }
  if (perguntas.length === 0) {
    await digitarParagrafo(corpo, "Nenhuma pergunta encontrada nesse arquivo.", "erro-texto");
    return;
  }

  const total = perguntas.length;
  const valorQuestao = 10 / total;
  const ordem = embaralhar(perguntas);
  let nota = 0;
  let acertos = 0;
  const erros = [];

  for (let indice = 0; indice < ordem.length; indice++) {
    const questao = ordem[indice];
    const corpoQ = cabecalho("Quiz Literário");

    const status = document.createElement("p");
    status.className = "destaque-texto";
    status.textContent = `Questão ${indice + 1} de ${total} — Nota atual: ${nota.toFixed(1)}`;
    corpoQ.appendChild(status);
    corpoQ.appendChild(linhaOrnamento("-"));

    for (const texto of questao.textos) {
      if (texto.trim() !== "") await digitarParagrafo(corpoQ, texto);
    }
    await digitarParagrafo(corpoQ, questao.item, "destaque-texto");

    const respostaEscolhida = await new Promise(resolver => {
      for (const alternativa of questao.alternativas) {
        corpoQ.appendChild(criarBotao('<span class="rotulo">' + alternativa.rotulo + '</span>' + alternativa.texto, () => resolver(alternativa.rotulo)));
      }
      const campo = document.createElement("input");
      campo.type = "text";
      campo.placeholder = "ou digite a letra/número aqui";
      campo.autocomplete = "off";
      campo.onkeydown = (ev) => { if (ev.key === "Enter" && campo.value.trim() !== "") resolver(campo.value); };
      corpoQ.appendChild(campo);
      setTimeout(() => campo.focus(), 50);
    });

    const respostaUsuario = normalizarAlternativa(respostaEscolhida);
    const respostaCerta = normalizarAlternativa(questao.resposta);
    const acertou = respostaUsuario !== null && respostaUsuario === respostaCerta;

    const feedback = document.createElement("p");
    if (acertou) {
      nota += valorQuestao;
      acertos += 1;
      feedback.textContent = "Correto!";
      feedback.className = "destaque-texto";
      somAcerto();
    } else {
      feedback.textContent = "Errado!";
      feedback.className = "erro-texto";
      somErro();
      const indiceCerta = respostaCerta ? parseInt(respostaCerta, 10) - 1 : -1;
      const alternativaCerta = questao.alternativas[indiceCerta];
      erros.push({
        item: questao.item,
        rotulo: alternativaCerta ? alternativaCerta.rotulo : "?",
        texto: alternativaCerta ? alternativaCerta.texto : "",
      });
    }
    corpoQ.appendChild(feedback);

    await new Promise(resolver => {
      corpoQ.appendChild(criarBotao("Continuar", resolver));
    });
  }

  await telaResultado(nota, acertos, total, erros);
}

async function telaResultado(nota, acertos, total, erros) {
  const corpo = cabecalho("Resultado");
  await digitarParagrafo(corpo, `Nota final: ${nota.toFixed(2)}`, "destaque-texto");
  await digitarParagrafo(corpo, `Acertos: ${acertos} de ${total}`);

  if (erros.length > 0) {
    corpo.appendChild(linhaOrnamento("-"));
    await digitarParagrafo(corpo, "Revisão:", "destaque-texto");
    for (const erro of erros) {
      await digitarParagrafo(corpo, erro.item);
      await digitarParagrafo(corpo, `Resposta certa: ${erro.rotulo} - ${erro.texto}`);
    }
  }

  corpo.appendChild(criarBotao("Voltar ao início", telaMenu));
}

aplicarTema(CONFIG.tema);
telaIntro();
</script>
</body>
</html>
